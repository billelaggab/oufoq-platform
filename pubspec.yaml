name: oufoq_platform
description: "منصة أفق — تطبيق إخباري عربي احترافي مربوط بووردبريس (Flutter)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # الحالة والتنقل
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1

  # اللغات والتواريخ
  intl: ^0.20.3

  # الشبكة والكاش
  dio: ^5.11.1
  dio_cache_interceptor: ^4.0.7
  connectivity_plus: ^7.3.2

  # التخزين المحلي
  sqflite: ^2.4.5
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

  # المحتوى والصور
  cached_network_image: ^4.0.5
  flutter_widget_from_html: ^0.17.4
  fwfh_cached_network_image: ^0.16.3
  shimmer: ^4.0.0

  # الإعلانات والمشاركة والروابط
  google_mobile_ads: ^9.2.0
  share_plus: ^13.3.1
  url_launcher: ^6.3.3

  # الإشعارات
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3

  # أدوات مساعدة
  equatable: ^3.0.0
  flutter_cache_manager: ^3.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal/Tajawal-ExtraBold.ttf
          weight: 800
